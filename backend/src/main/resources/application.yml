server:
  port: 8080

spring:
  application:
    name: foodreach-backend
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/foodreach_db}
      auto-index-creation: true

app:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970" # 256-bit key
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "http://localhost:8080"
      - "http://127.0.0.1:5173"
      - "https://*.vercel.app"
      - "https://*.onrender.com"
      - "https://*.netlify.app"
      - "https://*.railway.app"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.foodreach: DEBUG
    org.springframework.data.mongodb: INFO
