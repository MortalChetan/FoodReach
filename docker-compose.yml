services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: foodreach-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=foodreach_db
    volumes:
      - mongo_data:/data/db
    networks:
      - foodreach-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Spring Boot 3.4 Backend API (Java 21)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodreach-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/foodreach_db
      - APP_JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - APP_JWT_EXPIRATION_MS=86400000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - foodreach-network

  # 3. React + Vite Nginx Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodreach-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      - backend
    networks:
      - foodreach-network

volumes:
  mongo_data:
    driver: local

networks:
  foodreach-network:
    driver: bridge
